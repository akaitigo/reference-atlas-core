name: control-plane-v1

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: DCO
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git log --format='%H%x00%B%x00' "$base..$head" | python3 scripts/check_dco.py
          else
            git log --format='%H%x00%B%x00' "HEAD^..HEAD" | python3 scripts/check_dco.py
          fi
      - name: Release gate
        run: make release-check
