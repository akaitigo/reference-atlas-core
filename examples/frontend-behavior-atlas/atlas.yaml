schema_version: 1
id: frontend-behavior-atlas
title: Webフロントエンド挙動 技術実証アトラス
owner:
  github: akaitigo
repository:
  url: https://github.com/akaitigo/frontend-behavior-atlas
  visibility: public
  default_branch: main
archetypes: [field, construction]
stage: 1
status: incomplete
language:
  primary: ja
  identifiers: en
coverage:
  epoch: "2026-08-28"
  manifest: coverage.yaml
authority:
  lockfile: sources.lock.yaml
  policy: primary-first
mastery:
  manifest: mastery.yaml
  contract_version: 1.0.0
scope:
  statement: Web UIの挙動、状態、入力、失敗、アクセシビリティ、性能を再実行可能な実験として証明する。
  exclusions:
    - 静的な見た目だけを示し、利用者操作や失敗条件を検証しないデザイン見本
integrates_with:
  - frontend-platform-reference-atlas
  - frontend-application-architecture-reference-atlas
  - design-system-component-engineering-reference-atlas
skills:
  router:
    id: fe-behavior-advisor
    path: .agents/skills/fe-behavior-advisor/SKILL.md
  package_manifest: skill.package.yaml
  evals: evals/
completion:
  policy_version: 1.0.0
  required_profiles: [local, container]
  certificate: evidence/completion-certificate.json
license:
  default: Apache-2.0
  notice: NOTICE
  third_party_manifest: third_party/manifest.yaml
  sbom: sbom.spdx.json
security:
  disclosure: SECURITY.md
  defensive_only: true
