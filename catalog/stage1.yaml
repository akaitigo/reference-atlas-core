schema_version: 1
catalog_id: stage1-programmable-computing
owner: akaitigo
coverage_epoch: "2026-08-28"
scope_statement: >-
  ソフトウェア、計算機システム、クラウド、データ、セキュリティ、AI、組込み・物理計算を、
  実装、運用、失敗、安全性、性能、移行、Agent Skillまで実証可能な技術分野として凍結する。
  個別製品の全列挙は行わず、代表製品を分野内で扱い、深掘り対象だけを製品アトラスへ分離する。
control_repositories:
  - reference-atlas-core
  - executable-technology-atlas
  - technology-atlas-skills
  - atlas-interoperability-lab

domains:
  - id: foundations
    title: 計算・ソフトウェアの基礎
    subjects:
      - id: algorithms-data-structures
        title: アルゴリズムとデータ構造
        repository: algorithms-data-structures-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 計算量、主要データ構造、探索、整列、グラフ、近似、実装上の選択を実証する。
        excludes: [特定言語の標準ライブラリ全APIの列挙]
      - id: mathematical-statistical-foundations
        title: 数学・統計基礎
        repository: mathematical-statistical-foundations-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 離散数学、線形代数、確率、統計、最適化を計算機実装との対応で実証する。
        excludes: [純粋数学の未解決問題と証明研究の網羅]
      - id: computational-mathematics-numerical
        title: 計算数学・数値計算
        repository: computational-mathematics-numerical-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 浮動小数点、誤差、数値線形代数、補間、積分、微分方程式を実証する。
        excludes: [商用数値計算製品の全機能比較]
      - id: formal-methods-verification
        title: 形式手法・検証
        repository: formal-methods-verification-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 形式仕様、モデル検査、定理証明、契約、プロパティ検査の適用境界を実証する。
        excludes: [すべての証明支援系の完全習得]
      - id: information-theory-coding
        title: 情報理論・符号化
        repository: information-theory-coding-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 情報量、圧縮、誤り訂正、通信路、符号化の基本性質と実装を実証する。
        excludes: [通信規格ごとの全符号方式の列挙]
      - id: artificial-intelligence-foundations
        title: 人工知能基礎
        repository: artificial-intelligence-foundations-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 探索、推論、知識表現、計画、学習の古典的基礎と限界を実証する。
        excludes: [個別生成AI製品の使用手順]
      - id: programming-language-foundations
        title: プログラミング言語基礎
        repository: programming-language-foundations-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 型、意味論、評価、抽象化、並行性、メモリモデルを小さな実装で実証する。
        excludes: [全プログラミング言語の文法一覧]
      - id: software-engineering-foundations
        title: ソフトウェア工学基礎
        repository: software-engineering-foundations-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: ライフサイクル、設計原則、構成管理、測定、専門倫理の基礎を実証する。
        excludes: [組織固有の人事評価制度]

  - id: systems
    title: 計算機システム
    subjects:
      - id: computer-architecture-digital-systems
        title: 計算機アーキテクチャ・デジタルシステム
        repository: computer-architecture-digital-systems-reference-atlas
        archetypes: [field, hardware-simulation]
        stage1_required: true
        status: planned
        scope: 命令実行、メモリ階層、入出力、パイプライン、デジタル論理をシミュレータで実証する。
        excludes: [半導体製造プロセスの実機再現]
      - id: fpga-hdl-hardware-software-codesign
        title: FPGA・HDL・ハードウェア協調設計
        repository: fpga-hdl-hardware-software-codesign-reference-atlas
        archetypes: [field, hardware-simulation]
        stage1_required: true
        status: planned
        scope: HDL、合成、タイミング、検証、ソフトウェア連携を無償シミュレータ中心に実証する。
        excludes: [高額な実機ボードを必須とする検証]
      - id: operating-system-kernel-engineering
        title: OS・カーネル工学
        repository: operating-system-kernel-engineering-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: プロセス、メモリ、同期、ファイル、デバイス、分離、障害をVMと実装で実証する。
        excludes: [全OSカーネルのソースコード解説]
      - id: programming-languages-compilers-runtimes
        title: 言語処理系・コンパイラ・ランタイム
        repository: programming-languages-compilers-runtimes-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 字句解析から最適化、実行時、GC、JIT、FFIまでを小さな処理系で実証する。
        excludes: [各言語の全仕様と全処理系の再実装]
      - id: database-engine-internals
        title: データベースエンジン内部
        repository: database-engine-internals-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 格納、索引、問い合わせ最適化、トランザクション、復旧、レプリケーションを実証する。
        excludes: [個別DB製品の運用機能の完全網羅]
      - id: storage-filesystem-engineering
        title: ストレージ・ファイルシステム工学
        repository: storage-filesystem-engineering-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: ブロック、ファイル、オブジェクト、整合性、耐久性、キャッシュ、故障復旧を実証する。
        excludes: [ベンダー専用ストレージ筐体の実機検証]
      - id: browser-engine-web-runtime
        title: ブラウザエンジン・Webランタイム
        repository: browser-engine-web-runtime-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 解析、レイアウト、描画、イベントループ、分離、キャッシュ、開発者APIの内部を実証する。
        excludes: [ブラウザ製品ごとのUI機能比較]
      - id: virtualization-emulation
        title: 仮想化・エミュレーション
        repository: virtualization-emulation-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: ハイパーバイザ、VM、命令エミュレーション、デバイス仮想化、隔離と性能を実証する。
        excludes: [商用仮想基盤の全管理画面解説]
      - id: linux-systems-engineering
        title: Linuxシステム工学
        repository: linux-systems-engineering-reference-atlas
        archetypes: [field, language-platform]
        stage1_required: true
        status: planned
        scope: 起動、プロセス、権限、サービス、パッケージ、ネットワーク、診断と保守を実証する。
        excludes: [全Linuxディストリビューションの差異一覧]
      - id: networking-protocols
        title: ネットワーク・プロトコル
        repository: networking-protocols-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: L2からアプリ層、名前解決、ルーティング、輻輳、負荷分散、障害を実証する。
        excludes: [通信事業者網の実機設備構築]
      - id: distributed-systems
        title: 分散システム
        repository: distributed-systems-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 時間、整合性、合意、複製、分割、冪等性、故障モデルを再現可能に実証する。
        excludes: [特定クラウドだけに依存する大規模負荷試験]
      - id: parallel-hpc
        title: 並列計算・HPC
        repository: parallel-hpc-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: スレッド、SIMD、共有・分散メモリ、スケーリング、数値ワークロードを実証する。
        excludes: [スーパーコンピュータ実機を必須とする計測]
      - id: gpu-computing
        title: GPU計算
        repository: gpu-computing-reference-atlas
        archetypes: [field, hardware-simulation]
        stage1_required: true
        status: planned
        scope: GPU実行モデル、メモリ、カーネル、性能分析、移植性をローカルまたは代替環境で実証する。
        excludes: [特定GPU購入を完了条件にすること]
      - id: webassembly-wasi
        title: WebAssembly・WASI
        repository: webassembly-wasi-reference-atlas
        archetypes: [field, specification]
        stage1_required: true
        status: planned
        scope: モジュール、ランタイム、ホスト連携、コンポーネント、安全境界、移植性を実証する。
        excludes: [提案段階仕様を完成済みとして扱うこと]
      - id: kotlin
        title: Kotlin
        repository: kotlin-reference-atlas
        archetypes: [product, language-platform]
        stage1_required: false
        status: active
        scope: Kotlin言語、JVMランタイム、並行処理、ビルド、相互運用、運用上の挙動を深掘りする。
        excludes: [Kotlinで利用可能な全ライブラリの列挙]
        representative_products: [Kotlin, JVM, Gradle]

  - id: software-engineering
    title: ソフトウェア設計・開発
    subjects:
      - id: requirements-engineering
        title: 要求工学
        repository: requirements-engineering-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 発見、分析、仕様化、検証、追跡、変更管理を実行可能な例と証拠で実証する。
        excludes: [特定業界の全業務要件テンプレート]
      - id: software-architecture
        title: ソフトウェアアーキテクチャ
        repository: software-architecture-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 品質特性、境界、分解、意思決定、進化、評価を比較可能な実装で実証する。
        excludes: [図だけで動作証拠を持たないパターン集]
      - id: api-integration-contracts
        title: API・統合・契約
        repository: api-integration-contracts-reference-atlas
        archetypes: [field, specification]
        stage1_required: true
        status: planned
        scope: HTTP、RPC、イベント、スキーマ、互換性、認証、再試行、契約試験を実証する。
        excludes: [公開APIサービスの全件カタログ]
      - id: workflow-batch-orchestration
        title: ワークフロー・バッチ・オーケストレーション
        repository: workflow-batch-orchestration-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: ジョブ、依存関係、再実行、補償、スケジュール、長期実行、失敗回復を実証する。
        excludes: [業務固有の承認フロー全種類]
      - id: software-quality-engineering
        title: ソフトウェア品質工学
        repository: software-quality-engineering-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 静的解析、各層の試験、プロパティ、変異、回帰、品質測定を実証する。
        excludes: [ツールの導入だけで品質完了とみなすこと]
      - id: software-maintenance-migration
        title: 保守・モダナイゼーション・移行
        repository: software-maintenance-migration-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 理解、依存更新、互換性、段階移行、データ移行、廃止、ロールバックを実証する。
        excludes: [停止時間や復旧経路のない一括移行]

  - id: client-applications
    title: フロントエンド・クライアント
    subjects:
      - id: frontend-platform
        title: Webフロントエンド基盤
        repository: frontend-platform-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: HTML、CSS、DOM、ネットワーク、ストレージ、セキュリティ、ブラウザAPIの基盤を実証する。
        excludes: [個別UI挙動パターンの重複収録]
      - id: frontend-behavior
        title: Webフロントエンド挙動
        repository: frontend-behavior-atlas
        archetypes: [field, construction]
        stage1_required: true
        status: existing
        scope: UI挙動、状態、入力、失敗、アクセシビリティ、性能を実行可能なパターンで実証する。
        excludes: [静的なデザイン見本だけの収録]
        existing_repository: frontend-behavior-atlas
      - id: frontend-application-architecture
        title: Webアプリケーション設計
        repository: frontend-application-architecture-reference-atlas
        archetypes: [field, construction]
        stage1_required: true
        status: planned
        scope: 状態管理、データ取得、ルーティング、境界、SSR、保守性、試験戦略を実証する。
        excludes: [単一フレームワークだけを唯一解とすること]
      - id: design-system-component-engineering
        title: デザインシステム・コンポーネント工学
        repository: design-system-component-engineering-reference-atlas
        archetypes: [field, construction]
        stage1_required: true
        status: planned
        scope: トークン、部品API、テーマ、合成、文書化、品質ゲート、配布を実証する。
        excludes: [ブランド固有の完成ビジュアル資産]
      - id: web-accessibility
        title: Webアクセシビリティ
        repository: web-accessibility-reference-atlas
        archetypes: [field, specification]
        stage1_required: true
        status: planned
        scope: 知覚、操作、理解、堅牢性、支援技術、試験の要件と失敗を実証する。
        excludes: [自動検査だけで適合を宣言すること]
      - id: web-performance
        title: Web性能工学
        repository: web-performance-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 読込、描画、応答、メモリ、ネットワーク、測定、性能予算と劣化を実証する。
        excludes: [再現条件のない単発ベンチマーク]
      - id: android-platform-engineering
        title: Androidプラットフォーム開発
        repository: android-platform-engineering-reference-atlas
        archetypes: [field, language-platform]
        stage1_required: true
        status: planned
        scope: ライフサイクル、UI、データ、バックグラウンド、権限、配布、端末差を実証する。
        excludes: [全Android端末での実機試験]
      - id: apple-platforms-engineering
        title: Appleプラットフォーム開発
        repository: apple-platforms-engineering-reference-atlas
        archetypes: [field, language-platform]
        stage1_required: true
        status: planned
        scope: iOSとmacOSのライフサイクル、UI、データ、権限、性能、配布を実証する。
        excludes: [有料端末購入を必須とする網羅試験]
      - id: windows-platform-engineering
        title: Windowsプラットフォーム開発
        repository: windows-platform-engineering-reference-atlas
        archetypes: [field, language-platform]
        stage1_required: true
        status: planned
        scope: Windowsアプリ、システムAPI、配布、権限、サービス、互換性をVM中心に実証する。
        excludes: [サポート終了済み全Windows版の実機保守]
      - id: linux-desktop-platform-engineering
        title: Linuxデスクトップ開発
        repository: linux-desktop-platform-engineering-reference-atlas
        archetypes: [field, language-platform]
        stage1_required: true
        status: planned
        scope: GUIツールキット、デスクトップ統合、表示基盤、入力、配布、互換性を実証する。
        excludes: [全デスクトップ環境の外観再現]
      - id: cross-platform-client
        title: クロスプラットフォームクライアント
        repository: cross-platform-client-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 共有コード、ネイティブ境界、描画、配布、試験、性能、プラットフォーム差を実証する。
        excludes: [個別フレームワークの全API解説]
      - id: flutter
        title: Flutter
        repository: flutter-reference-atlas
        archetypes: [product, language-platform]
        stage1_required: false
        status: active
        scope: FlutterとDartの描画、状態、プラグイン、試験、性能、配布を製品深掘りとして実証する。
        excludes: [公開パッケージ全件の評価]
        representative_products: [Flutter, Dart]

  - id: cloud-delivery-operations
    title: クラウド・デリバリー・運用
    subjects:
      - id: oci-container-engineering
        title: OCIコンテナ工学
        repository: oci-container-engineering-reference-atlas
