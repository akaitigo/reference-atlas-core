      - id: ci-cd-release-engineering
        title: CI/CD・リリース工学
        repository: ci-cd-release-engineering-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: ビルド、試験、成果物、昇格、配備、ロールバック、承認、証跡を実証する。
        excludes: [単一CI製品の設定項目一覧]
      - id: software-supply-chain
        title: ソフトウェアサプライチェーン
        repository: software-supply-chain-reference-atlas
        archetypes: [field, specification]
        stage1_required: true
        status: planned
        scope: 依存、SBOM、署名、来歴、再現ビルド、脆弱性、方針適用を実証する。
        excludes: [検証不能な安全性の絶対保証]
      - id: gitops-continuous-delivery
        title: GitOps・継続的デリバリー
        repository: gitops-continuous-delivery-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: Git宣言、調整、差分、昇格、秘密、マルチ環境、復旧をローカル環境で実証する。
        excludes: [特定GitOps製品だけの運用手順]
      - id: observability-engineering
        title: オブザーバビリティ工学
        repository: observability-engineering-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: ログ、メトリクス、トレース、プロファイル、相関、計装、保管、診断を実証する。
        excludes: [可視化画面の作成だけで完了とすること]
      - id: sre-incident-operations
        title: SRE・インシデント運用
        repository: sre-incident-operations-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: SLI、SLO、エラー予算、当番、対応、振り返り、自動化、トイル削減を実証する。
        excludes: [実在組織の未公開インシデント情報]
      - id: resilience-continuity-disaster-recovery
        title: レジリエンス・事業継続・災害復旧
        repository: resilience-continuity-disaster-recovery-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 障害注入、冗長化、バックアップ、復元、RTO・RPO、演習、縮退を実証する。
        excludes: [演習なしの机上計画だけで完了とすること]
      - id: platform-engineering-developer-experience
        title: プラットフォーム工学・開発者体験
        repository: platform-engineering-developer-experience-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 内部開発基盤、セルフサービス、テンプレート、標準経路、測定、統治を実証する。
        excludes: [ポータル製品導入だけで完了とすること]
