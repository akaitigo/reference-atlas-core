      - id: container-orchestration
        title: コンテナオーケストレーション
        repository: container-orchestration-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 宣言状態、配置、サービス、構成、永続化、更新、障害復旧をローカルクラスタで実証する。
        excludes: [特定マネージドサービスだけの手順集]
      - id: cloud-architecture
        title: クラウドアーキテクチャ
        repository: cloud-architecture-reference-atlas
        archetypes: [field]
        stage1_required: true
        status: planned
        scope: 責任分界、リージョン、可用性、ネットワーク、データ、管理面をベンダー横断で実証する。
